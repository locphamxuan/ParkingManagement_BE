services:
  # CẢNH BÁO TRƯỚC KHI DEPLOY SERVICE NÀY: paddlepaddle + model PP-OCR ngốn bộ nhớ
  # hơn hẳn hạn mức của một instance free (512MB), và instance free còn ngủ đông sau
  # ~15 phút không có request — lần quét đầu sau khi ngủ phải nạp lại model nên rất
  # dễ vượt PADDLE_OCR_TIMEOUT_MS. Muốn dùng PaddleOCR thật thì nâng `plan` lên gói
  # có RAM lớn hơn, hoặc self-host ở máy khác rồi trỏ PADDLE_OCR_URL sang đó.
  # Bám gói free → dùng gemini (chỉ cần GEMINI_API_KEY, không cần service này).
  - type: web
    name: pbms-ocr
    runtime: python
    plan: free
    rootDir: ocr-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: pbms-api
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUSINESS_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Camera cổng. Không cấu hình provider nào → mọi lần quét trả 503
      # AI_SCAN_NOT_CONFIGURED (service không có nhánh mock).
      # Đặt CẢ HAI provider là cấu hình an toàn nhất: OCR_PROVIDER quyết định cái
      # nào chạy trước, cái còn lại tự động đỡ khi cái chính không phản hồi.
      - key: GEMINI_API_KEY
        sync: false
      - key: OCR_PROVIDER
        sync: false
      - key: PADDLE_OCR_URL
        sync: false
      # Nới lên ~60000 nếu PADDLE_OCR_URL trỏ tới host có ngủ đông (xem cảnh báo
      # ở service pbms-ocr phía trên).
      - key: PADDLE_OCR_TIMEOUT_MS
        sync: false
      - key: KIOSK_DEVICE_TOKEN
        generateValue: true
