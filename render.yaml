services:
  - type: web
    name: pbms-ocr
    runtime: python
    plan: free
    rootDir: ocr-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: web
    name: pbms-api
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUSINESS_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Camera cổng: không cấu hình provider nào thì mọi lần quét trả 503
      # AI_SCAN_NOT_CONFIGURED (service không có nhánh mock). Trên Render free
      # chỉ dùng được gemini — PaddleOCR là bản self-host, phải trỏ
      # PADDLE_OCR_URL sang máy khác nếu muốn dùng.
      - key: GEMINI_API_KEY
        sync: false
      - key: OCR_PROVIDER
        sync: false
      - key: PADDLE_OCR_URL
        sync: false
      - key: KIOSK_DEVICE_TOKEN
        generateValue: true
