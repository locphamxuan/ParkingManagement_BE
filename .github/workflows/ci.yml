name: Backend CI

# Chỉ KIỂM TRA, không deploy — file này từng tên là ci-cd.yml nhưng chưa bao giờ
# có bước CD. Việc deploy do chính nền tảng hosting kéo từ nhánh main (bật
# auto-deploy trong dashboard của nền tảng), repo này không giữ thông tin
# tài khoản hay URL triển khai nào.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
        run: npm test -- --ci
